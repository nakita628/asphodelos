# A JSON body has types of its own, so nothing in it is read from text — with the exceptions
# Elysia makes on purpose: `t.Integer` reads a string of digits, and `t.Date` reads a string or
# a number. An `int64` arrives as a number, exact up to `Number.MAX_SAFE_INTEGER` and refused
# beyond it, since the generated schema caps every integer there.
#
# `/numbers`  integers in each of their forms: int64, int32, bounds, enum, const, default, null.
# `/types`    `type` as a list of types, string formats, and the shapes of an object.
openapi: 3.1.0
info:
  title: JSON Body Matrix
  version: 0.0.0
paths:
  /numbers:
    post:
      operationId: numbers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: integer, format: int64 }
                ranged: { type: integer, format: int64, minimum: 1, maximum: 100 }
                level: { type: integer, enum: [1, 2] }
                version: { type: integer, const: 5 }
                cursor: { type: integer, default: 0 }
                maybe: { type: [integer, 'null'] }
                ids: { type: array, items: { type: integer } }
                small: { type: integer, format: int32 }
                ratio: { type: number }
                active: { type: boolean }
                ref: { $ref: '#/components/schemas/Id' }
      responses:
        '200': { description: OK }
  /types:
    post:
      operationId: types
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                either: { type: [integer, string] }
                flagged: { type: [number, boolean, 'null'] }
                bounded: { type: [integer, string], minimum: 1, minLength: 2 }
                # `date-time` and `date` are read into a `Date`; `time` stays an RFC 3339 string.
                moment: { type: string, format: date-time }
                day: { type: string, format: date }
                clock: { type: string, format: time }
                bytes: { type: string, format: byte }
                # Declared properties beside `additionalProperties`: `name` is a string, and every
                # other key an integer.
                labelled:
                  type: object
                  properties:
                    name: { type: string }
                  additionalProperties: { type: integer }
                # A closed object.
                strict:
                  type: object
                  properties:
                    a: { type: integer }
                  additionalProperties: false
                # A property named like what every JavaScript object inherits.
                inherited:
                  type: object
                  properties:
                    constructor: { type: integer }
                    name: { type: string }
      responses:
        '200': { description: OK }
components:
  schemas:
    Id: { type: integer, format: int64, minimum: 0 }

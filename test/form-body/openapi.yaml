# A form body, `application/x-www-form-urlencoded` or `multipart/form-data`, carries every field
# as text (or as a file), exactly like a query string. A schema written for a typed value rejects
# all of it: what the generated schema has to prove is that each field arrives as the right
# JavaScript type. A JSON body is the contrast: it has types of its own.
#
# `/urlencoded`  every kind of field, each optional so a test sends one alone.
# `/multipart`   a file beside fields that are read from text.
# `/component`   the body is a component schema, the same one `/json` takes. The component is
#                written for typed values, so only what Elysia reads from text on its own works.
# `/json`        the same component as a JSON body, which stays typed.
openapi: 3.1.0
info:
  title: Form Body Matrix
  version: 0.0.0
paths:
  /urlencoded:
    post:
      operationId: urlencoded
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name: { type: string }
                age: { type: integer, minimum: 0 }
                ratio: { type: number }
                big: { type: integer, format: int64 }
                active: { type: boolean }
                level: { type: integer, enum: [1, 2] }
                agreed: { type: boolean, const: true }
                limit: { type: integer, default: 20 }
                count: { $ref: '#/components/schemas/Count' }
                flag: { $ref: '#/components/schemas/Flag' }
                tags: { type: array, items: { type: string } }
                ids: { type: array, items: { type: integer } }
                flags: { type: array, items: { type: boolean } }
                # An RFC 3339 date-time: an offset is valid beside `Z`.
                moment: { type: string, format: date-time }
                clock: { type: string, format: time }
                # A form field is text, and `null` has no spelling of its own in one.
                maybe: { type: [integer, 'null'] }
                label: { type: [string, 'null'] }
                either: { type: [integer, string] }
      responses:
        '200': { description: OK }
  /multipart:
    post:
      operationId: multipart
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                files: { type: array, items: { type: string, format: binary } }
                age: { type: integer }
                ratio: { type: number }
                active: { type: boolean }
                ids: { type: array, items: { type: integer } }
      responses:
        '200': { description: OK }
  /component:
    post:
      operationId: component
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/Item' }
      responses:
        '200': { description: OK }
  /json:
    post:
      operationId: json
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Item' }
      responses:
        '200': { description: OK }
components:
  schemas:
    Count: { type: integer, minimum: 0 }
    Flag: { type: boolean }
    Item:
      type: object
      required: [name, price]
      properties:
        name: { type: string }
        price: { type: integer, minimum: 0 }
        stocked: { type: boolean }

# Every parameter shape the generator supports, as a query parameter: each `type` and `format`,
# once on its own and once as an array. HTTP delivers all of them as strings, so what the generated
# schema has to prove is that each arrives as the right JavaScript type once Elysia has read it.
#
# `/params`    every shape, scalar and array, each optional so a test sends one alone.
# `/literals`  `enum` and `const` of a string, alone and as an array.
# `/optional`  absent parameters, and names that are not identifiers.
# `/defaults`  what an absent parameter falls back to.
# `/required`  what happens when a required parameter is missing.
# `/limits`    constraints, on a scalar and on an array.
# `/refs`      a schema behind `$ref`, and a parameter behind `$ref`.
# `/inherited` a parameter declared on the path item, inherited by its operation, and one the
#              operation overrides.
# `/limitations` the shapes the generated schema declares but Elysia's query reader does not
#              turn into their value: a numeric `enum`, and `null`.
openapi: 3.1.0
info:
  title: Query Parameter Matrix
  version: 0.0.0
paths:
  /params:
    get:
      operationId: queryParams
      parameters:
        - { name: integer, in: query, schema: { type: integer } }
        - { name: integer_arr, in: query, schema: { type: array, items: { type: integer } } }
        - { name: int32, in: query, schema: { type: integer, format: int32 } }
        - {
            name: int32_arr,
            in: query,
            schema: { type: array, items: { type: integer, format: int32 } },
          }
        - { name: int64, in: query, schema: { type: integer, format: int64 } }
        - { name: number, in: query, schema: { type: number } }
        - { name: number_arr, in: query, schema: { type: array, items: { type: number } } }
        - { name: float, in: query, schema: { type: number, format: float } }
        - { name: double, in: query, schema: { type: number, format: double } }
        - { name: boolean, in: query, schema: { type: boolean } }
        - { name: boolean_arr, in: query, schema: { type: array, items: { type: boolean } } }
        - { name: string, in: query, schema: { type: string } }
        - { name: string_arr, in: query, schema: { type: array, items: { type: string } } }
        - { name: email, in: query, schema: { type: string, format: email } }
        - {
            name: email_arr,
            in: query,
            schema: { type: array, items: { type: string, format: email } },
          }
        - { name: uuid, in: query, schema: { type: string, format: uuid } }
        - { name: uri, in: query, schema: { type: string, format: uri } }
        - { name: url, in: query, schema: { type: string, format: url } }
        - { name: hostname, in: query, schema: { type: string, format: hostname } }
        - { name: ipv4, in: query, schema: { type: string, format: ipv4 } }
        - { name: ipv6, in: query, schema: { type: string, format: ipv6 } }
        - { name: date, in: query, schema: { type: string, format: date } }
        - { name: datetime, in: query, schema: { type: string, format: date-time } }
        - { name: time, in: query, schema: { type: string, format: time } }
        - { name: duration, in: query, schema: { type: string, format: duration } }
        - { name: byte, in: query, schema: { type: string, format: byte } }
        - { name: password, in: query, schema: { type: string, format: password } }
      responses:
        '200': { description: OK }
  /literals:
    get:
      operationId: queryLiterals
      parameters:
        - { name: senum, in: query, schema: { type: string, enum: [asc, desc] } }
        - {
            name: senum_arr,
            in: query,
            schema: { type: array, items: { type: string, enum: [asc, desc] } },
          }
        - { name: sconst, in: query, schema: { type: string, const: fixed } }
        # A string enum whose members look like numbers and booleans must stay text.
        - { name: numericsenum, in: query, schema: { type: string, enum: ['1', '02', 'true'] } }
      responses:
        '200': { description: OK }
  /optional:
    get:
      operationId: queryOptional
      parameters:
        - { name: int_opt, in: query, schema: { type: integer } }
        - { name: bool_opt, in: query, schema: { type: boolean } }
        - { name: str_opt, in: query, schema: { type: string } }
        - { name: arr_opt, in: query, schema: { type: array, items: { type: integer } } }
        # Names that are not JavaScript identifiers.
        - { name: page-size, in: query, schema: { type: integer } }
        - { name: 'filter[name]', in: query, schema: { type: string } }
        - { name: '$top', in: query, schema: { type: integer } }
        - { name: user.id, in: query, schema: { type: integer } }
        # Differs from `int_opt` by case alone: names are case-sensitive.
        - { name: Int_Opt, in: query, schema: { type: string } }
      responses:
        '200': { description: OK }
  /defaults:
    get:
      operationId: queryDefaults
      parameters:
        - { name: int_def, in: query, schema: { type: integer, default: 20 } }
        - { name: num_def, in: query, schema: { type: number, default: 0.5 } }
        - { name: bool_def, in: query, schema: { type: boolean, default: false } }
        - { name: str_def, in: query, schema: { type: string, default: fallback } }
        - { name: enum_def, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
        - {
            name: arr_def,
            in: query,
            schema: { type: array, items: { type: string }, default: [] },
          }
      responses:
        '200': { description: OK }
  /required:
    get:
      operationId: queryRequired
      parameters:
        - { name: id, in: query, required: true, schema: { type: integer } }
        - { name: flag, in: query, required: true, schema: { type: boolean } }
        - { name: name, in: query, required: true, schema: { type: string } }
        - {
            name: tags,
            in: query,
            required: true,
            schema: { type: array, items: { type: integer } },
          }
        # `required: false` written out is the same as leaving `required` off.
        - { name: note, in: query, required: false, schema: { type: integer } }
      responses:
        '200': { description: OK }
  /limits:
    get:
      operationId: queryLimits
      parameters:
        - { name: range, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - {
            name: exclusive,
            in: query,
            schema: { type: number, exclusiveMinimum: 0, exclusiveMaximum: 1 },
          }
        - { name: multiple, in: query, schema: { type: integer, multipleOf: 5 } }
        - { name: length, in: query, schema: { type: string, minLength: 2, maxLength: 4 } }
        - { name: pattern, in: query, schema: { type: string, pattern: '^[a-z]+-\d{1,3}$' } }
        - {
            name: items,
            in: query,
            schema: { type: array, items: { type: integer }, minItems: 2, maxItems: 3 },
          }
        - {
            name: unique,
            in: query,
            schema: { type: array, items: { type: integer }, uniqueItems: true },
          }
        - {
            name: ranged_items,
            in: query,
            schema: { type: array, items: { type: integer, minimum: 1, maximum: 9 } },
          }
      responses:
        '200': { description: OK }
  /refs:
    get:
      operationId: queryRefs
      parameters:
        - { name: count, in: query, schema: { $ref: '#/components/schemas/Count' } }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: OK }
  /inherited:
    parameters:
      - { name: tenant, in: query, required: true, schema: { type: string } }
      - { name: page, in: query, schema: { type: integer } }
    get:
      operationId: queryInherited
      parameters:
        # The operation's own declaration replaces the path item's for the same name.
        - { name: page, in: query, schema: { type: string } }
      responses:
        '200': { description: OK }
  /limitations:
    get:
      operationId: queryLimitations
      parameters:
        - { name: ienum, in: query, schema: { type: integer, enum: [1, 2, 3] } }
        - { name: inull, in: query, schema: { type: [integer, 'null'] } }
      responses:
        '200': { description: OK }
components:
  schemas:
    Count: { type: integer, minimum: 0 }
  parameters:
    Cursor: { name: cursor, in: query, schema: { type: string, minLength: 1 } }

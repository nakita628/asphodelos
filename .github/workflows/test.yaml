name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # `oxfmt` reads oxfmt.config.ts at the repository root; `oxlint` reads
      # packages/asphodelos/oxlint.config.ts, and needs a Node runtime that can execute
      # TypeScript to load it.
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Format
        run: bun run fmt:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: cd packages/asphodelos && bun test --coverage

      # The client suite compiles and runs the generated hooks against the real @tanstack/* and
      # swr packages, so it needs the package built: each case's config imports `asphodelos` by
      # name and the generator is invoked through `dist`.
      - name: Client suite
        run: bun run test:clients

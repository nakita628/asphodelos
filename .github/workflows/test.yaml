name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # oxfmt and oxlint read oxfmt.config.ts / oxlint.config.ts at the repository root.
      # `oxlint` needs a Node runtime that can execute TypeScript to load its config.
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Format
        run: bun run fmt:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test --coverage

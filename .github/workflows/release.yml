name: release

# Publishes packages/asphodelos to npm and cuts a GitHub release, driven entirely by the `version`
# field of its package.json: bump it on main and, once Test is green for that push, the version
# is tagged, published (only if npm does not have it yet) and released. Every job works from the
# commit Test ran on (`head_sha`), so the tag, the npm tarball and the GitHub release always
# describe the same commit. A push that does not change the version does nothing, and every job
# is safe to re-run.
#
# `workflow_run` is the trigger zizmor warns about because it hands a token to code from a pull
# request when misused; here it runs only for a `push` to main, every job works from the commit
# Test ran on, and the token stays read-only except where a tag or a release is written.
#
# Action versions are pinned to a commit digest with the tag kept as a comment.

on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [Test]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: release
  queue: max

jobs:
  check:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
      unpublished: ${{ steps.ver.outputs.unpublished }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Check version and npm publish state
        id: ver
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version packages/asphodelos/package.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if ! VERSIONS=$(npm view asphodelos versions --json); then
            echo "::error::Failed to query the npm registry for asphodelos versions. Check https://status.npmjs.org/ and re-run the workflow"
            exit 1
          fi
          if ! PUBLISHED=$(echo "$VERSIONS" | jq --arg version "$VERSION" '[.] | flatten | index($version) != null'); then
            echo "::error::Unexpected npm registry response. Re-run the workflow"
            exit 1
          fi
          if [ "$PUBLISHED" = "true" ]; then
            echo "unpublished=false" >> "$GITHUB_OUTPUT"
          else
            echo "unpublished=true" >> "$GITHUB_OUTPUT"
          fi

  tag:
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: write
    steps:
      # Through the REST API rather than `git push`: no checkout, so no credentials persist on disk,
      # and a private repository needs no git authentication.
      - name: Create or verify tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.check.outputs.version }}
          UNPUBLISHED: ${{ needs.check.outputs.unpublished }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          REF="refs/tags/v$VERSION"
          if ! MATCHES=$(gh api "repos/$GH_REPO/git/matching-refs/tags/v$VERSION"); then
            echo "::error::Failed to query $GH_REPO for tag v$VERSION. Check https://www.githubstatus.com/ and re-run the workflow"
            exit 1
          fi
          TAG=$(echo "$MATCHES" | jq -c --arg ref "$REF" '.[] | select(.ref == $ref) | .object')
          if [ -z "$TAG" ]; then
            if [ "$UNPUBLISHED" = "false" ]; then
              # Published without a tag (by hand, outside this workflow): npm records the commit a
              # package was published from as `gitHead`, which says whether it is this one.
              GIT_HEAD=$(npm view "asphodelos@$VERSION" gitHead 2>/dev/null || true)
              if [ "$GIT_HEAD" != "$HEAD_SHA" ]; then
                echo "::error::asphodelos@$VERSION is already published from ${GIT_HEAD:-an unrecorded commit}, not from $HEAD_SHA, and tag v$VERSION does not exist. Tag the commit that was actually published (git tag v$VERSION <sha> && git push origin v$VERSION), or bump the version and push again"
                exit 1
              fi
            fi
            gh api "repos/$GH_REPO/git/refs" -f ref="$REF" -f sha="$HEAD_SHA" >/dev/null
            echo "created tag v$VERSION at $HEAD_SHA"
            exit 0
          fi
          TAG_SHA=$(echo "$TAG" | jq -r .sha)
          # An annotated tag points at a tag object; the commit is one level further.
          if [ "$(echo "$TAG" | jq -r .type)" = "tag" ]; then
            TAG_SHA=$(gh api "repos/$GH_REPO/git/tags/$TAG_SHA" --jq .object.sha)
          fi
          if [ "$TAG_SHA" = "$HEAD_SHA" ]; then
            echo "tag v$VERSION already points to $HEAD_SHA; skip"
            exit 0
          fi
          if [ "$UNPUBLISHED" = "false" ] && gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION already fully released from $TAG_SHA; nothing to do for $HEAD_SHA"
            exit 0
          fi
          echo "::error::v$VERSION already points to another commit ($TAG_SHA, expected $HEAD_SHA). Re-run the release workflow for $TAG_SHA, or bump the version in packages/asphodelos/package.json and push again"
          exit 1

  publish:
    runs-on: ubuntu-latest
    needs: [check, tag]
    if: needs.check.outputs.unpublished == 'true'
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - run: bun -F asphodelos build

      # The upload is npm's, not `bun publish`: npm trusted publishing exchanges this job's OIDC
      # token (`id-token: write`) for a short-lived publish credential, so no npm token is stored
      # anywhere, and `bun publish` can only authenticate with a stored token. It needs
      # npm >= 11.5.1, which Node 24 ships.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'

      - run: npm publish
        working-directory: packages/asphodelos

  release:
    runs-on: ubuntu-latest
    needs: [check, tag, publish]
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.tag.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    permissions:
      contents: write
    steps:
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          gh release view "v$VERSION" >/dev/null 2>&1 && { echo "release v$VERSION already exists; skip"; exit 0; }
          gh release create "v$VERSION" --verify-tag --generate-notes

name: Test

# Format, lint, typecheck and test the workspace with the same commands a developer runs locally,
# in the same order: the root `package.json` scripts are the repository's single definition of
# "clean", so CI and the working copy can never disagree about what it means.
#
# Action versions are pinned to a commit digest with the tag kept as a comment. A floating tag is
# a mutable dependency with write access to the job.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # The Bun version comes from `packageManager` in the root package.json, so CI runs the same
      # Bun as every local checkout.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      # `oxfmt` reads oxfmt.config.ts at the repository root; `oxlint` reads
      # packages/asphodelos/oxlint.config.ts, and needs a Node runtime that can execute
      # TypeScript to load it.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'

      - name: Format
        run: bun run fmt:check

      # oxlint over the package, then markdownlint, textlint, cspell and secretlint over the docs
      # and configs, the check that the @typespec/* packages in bun.lock are one TypeSpec release,
      # and actionlint and zizmor over the workflows. The client suite is linted in its own step
      # below, once the code it imports has been generated.
      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun -F asphodelos test --coverage

      # The client suite compiles, lints and runs the generated hooks against the real
      # @tanstack/* and swr packages, so it needs the package built: each case's config imports
      # `asphodelos` by name and the generator is invoked through `dist`.
      - name: Client suite
        run: bun run test:clients

      # Packs the npm tarball and installs it with npm into an empty project, the one place the
      # package meets a resolver that bun.lock does not pin.
      - name: Package smoke test
        run: bun run test:pack
